version: "3.8"

networks:
  food-delivery-net:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: fd-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topics-init:
    image: bitnami/kafka:3.7
    container_name: fd-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      for topic in orders.created orders.confirmed orders.rejected orders.preparing orders.ready orders.cancelled payments.requested payments.completed payments.failed delivery.assigned delivery.location_updated delivery.completed ;
      do
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1 ;
      done
      "

  postgres:
    image: postgres:16-alpine
    container_name: fd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fooddelivery
      POSTGRES_PASSWORD: fooddelivery
      POSTGRES_DB: fooddelivery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooddelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: fd-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - food-delivery-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------------------
  customer-service:
    build: ./customer-service
    container_name: fd-customer-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=fooddelivery
      - DB_USER=fooddelivery
      - DB_PASSWORD=fooddelivery
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net

  restaurant-service:
    build: ./restaurant-service
    container_name: fd-restaurant-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=fooddelivery
      - DB_USER=fooddelivery
      - DB_PASSWORD=fooddelivery
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net

  order-service:
    build: ./order-service
    container_name: fd-order-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=fooddelivery
      - DB_USER=fooddelivery
      - DB_PASSWORD=fooddelivery
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net

  payment-service:
    build: ./payment-service
    container_name: fd-payment-service
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=fooddelivery
      - DB_USER=fooddelivery
      - DB_PASSWORD=fooddelivery
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net

  delivery-service:
    build: ./delivery-service
    container_name: fd-delivery-service
    ports:
      - "8085:8085"
    environment:
      - MONGO_URI=mongodb://mongo:27017/fooddelivery
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net

  notification-service:
    build: ./notification-service
    container_name: fd-notification-service
    ports:
      - "8086:8086"
    environment:
      - MONGO_URI=mongodb://mongo:27017/fooddelivery
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net

  admin-service:
    build: ./admin-service
    container_name: fd-admin-service
    ports:
      - "8087:8087"
    environment:
      - MONGO_URI=mongodb://mongo:27017/fooddelivery
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - food-delivery-net
